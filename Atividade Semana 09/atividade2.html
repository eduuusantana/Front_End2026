<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Dinâmico</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: rgb(174, 224, 224);
            font-family: 'Montserrat', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 380px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            background-color: white;
            color: #222;
        }

        .campo {
            background-color: white;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            background-color: white;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background-color: white;
        }

        input:focus {
            border-color: rgb(72, 150, 150);
        }

        .info {
            margin-top: 15px;
            background-color: white;
            color: #555;
            font-size: 0.9rem;
        }

    </style>
</head>
<body>

    <div class="container">

        <h1>Conversor Dinâmico</h1>

        <div class="campo">
            <label for="celsius">Celsius (°C)</label>
            <input type="number" id="celsius" step="0.1" placeholder="Digite em Celsius">
        </div>

        <div class="campo">
            <label for="fahrenheit">Fahrenheit (°F)</label>
            <input type="number" id="fahrenheit" step="0.1" placeholder="Digite em Fahrenheit">
        </div>

        <p class="info">
            Conversão automática em tempo real
        </p>

    </div>

    <script>

        const celsius = document.getElementById("celsius");
        const fahrenheit = document.getElementById("fahrenheit");

        celsius.addEventListener("input", () => {

            let c = parseFloat(celsius.value);

            if (isNaN(c)) {
                fahrenheit.value = "";
                return;
            }

            let f = (c * 9/5) + 32;

            fahrenheit.value = f.toFixed(2);

        });
        fahrenheit.addEventListener("input", () => {

            let f = parseFloat(fahrenheit.value);

            if (isNaN(f)) {
                celsius.value = "";
                return;
            }

            let c = (f - 32) * 5/9;

            celsius.value = c.toFixed(2);

        });

    </script>

</body>
</html>
